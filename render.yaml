# Render Blueprint: New > Blueprint > select this repository.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: agribot-backend
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    # Keep a single instance: robot presence and the command queue are in memory.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ROBOT_INGEST_KEY
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGINS
        value: "*"
